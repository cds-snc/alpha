name: Deploy to AWS

on:
  push:
    branches:
      - main

permissions:
  id-token: write
  contents: read

jobs:
  build:
    name: Deploy
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: configure aws credentials using OIDC
        uses: aws-actions/configure-aws-credentials@61815dcd50bd041e203e49132bacad1fd04d2708 # v5.1.1
        with:
          role-to-assume: arn:aws:iam::414662622316:role/alpha-apply 
          role-session-name: WebsiteDeploy
          aws-region: ca-central-1

      - name: AWS Deploy
        run: |
          aws s3 sync . s3://${{ secrets.AWS_BUCKET }} --delete --exclude='.git'

      - name: AWS Invalidate
        run: aws cloudfront create-invalidation --distribution-id ${{ secrets.AWS_CF_ID }} --paths "/*"
